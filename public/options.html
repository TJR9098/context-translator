<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型设置 · 全文伴读</title><link rel="stylesheet" href="app.css"></head><body><main class="settings">
<header><p class="eyebrow">Context Translator / Settings</p><h1>连接你的翻译模型</h1><p class="muted">设置仅保存在本机浏览器。正文直接发送到你配置的模型接口。</p></header>
<form id="form" class="card"><h2>模型连接</h2><label>Base URL<input name="baseUrl" type="url" required placeholder="https://api.deepseek.com"><small>支持 HTTP / HTTPS、服务根地址、/v1 地址或完整 /chat/completions 地址。</small></label>
<label>API Key<input name="apiKey" type="password" required autocomplete="off" spellcheck="false" placeholder="在此填写密钥"></label>
<label>模型名称<input name="model" required spellcheck="false" placeholder="deepseek-flash"><small>使用你的服务商实际支持的模型 ID。</small></label>
<details><summary>长文与缓存设置</summary><div class="grid"><label>上下文容量（tokens）<input name="contextTokens" type="number" min="8192" max="4000000" required><small>按实际模型填写；包括输入与输出。正文使用保守估算。</small></label><label>单批输出上限（tokens）<input name="maxOutputTokens" type="number" min="2048" max="131072" required><small>需要小于上下文容量的一半。</small></label></div><label><input name="cache" type="checkbox"> 在本地缓存译文，减少重复调用</label><button id="clear-cache" type="button">清空译文缓存</button></details>
<div class="actions"><button class="primary" type="submit">保存设置</button><button id="test" type="button">测试连接</button><a href="reader.html" target="_blank">打开 PDF 阅读器</a></div><p class="status" id="status" role="status" aria-live="polite"></p><p class="note">测试连接会发送一次短请求。设置修改后，重新点击“翻译全文”即可使用新配置。</p></form>
</main><script type="module" src="options.js"></script></body></html>
