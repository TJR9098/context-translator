<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 伴读 · 全文伴读</title><link rel="stylesheet" href="app.css"></head><body>
<header class="reader-header"><p class="eyebrow">Context Translator / PDF</p><h1>把论文读成双语</h1><p class="muted">文字型 PDF · 全文上下文 · 逐段对照</p><div class="actions"><button id="choose" class="primary" disabled>选择本地 PDF</button><input id="file" type="file" accept="application/pdf,.pdf" hidden disabled><a href="options.html" target="_blank">模型设置</a></div><form id="url-form" class="source"><input id="url" type="url" aria-label="在线 PDF 链接" placeholder="或粘贴在线 PDF 链接，例如 https://arxiv.org/pdf/…" required><button id="load-url" type="submit" disabled>加载链接</button></form><div class="document-name" id="name"></div></header>
<div class="reader-toolbar"><div class="actions"><button id="start" class="primary" disabled>翻译全文</button><button id="stop" disabled>停止</button><button id="toggle" disabled>隐藏译文</button><button id="retry" disabled>重试失败</button></div><p id="status" class="status" role="status" aria-live="polite">正在初始化 PDF 阅读器…</p></div>
<main id="pages" class="reader-main"><div class="empty"><h2>全文读取，然后逐段翻译</h2><p class="muted">支持在线和本地文字型 PDF。图表和复杂公式可通过每页的“查看本页原版”核对。</p><p class="note">重新排版不保留双栏与原始分页内的段落位置；扫描件不进行 OCR。</p></div></main>
<script type="module" src="reader.js"></script></body></html>
